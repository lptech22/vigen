<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Vigen Stage</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script src="./props.js"></script>
<script src="./cast.js"></script>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d', { alpha: false });

  const UI = 'VigenUI, sans-serif';
  const SERIF = 'VigenDisplay, "DejaVu Serif", serif';
  let DISPLAY = SERIF;

  const SEPIA = {
    bgTop: '#15100b',
    bgMid: '#21170f',
    bgBottom: '#2b1d13',
    ink: '#f2e6c9',
    inkSoft: 'rgba(242,230,201,0.72)',
    inkFaint: 'rgba(242,230,201,0.40)',
    gold: '#c9a227',
    goldSoft: 'rgba(201,162,39,0.45)',
    line: 'rgba(242,230,201,0.16)',
    stamp: '#b23b32',
    paper: 'rgba(235,220,190,0.96)',
    paperInk: '#332414',
    paperInkSoft: '#5a432c',
    subBg: 'rgba(9,6,4,0.78)',
    subBorder: 'rgba(201,162,39,0.30)',
    subInk: '#f2e6c9',
    subActive: '#ffd45e',
    subInkFaint: 'rgba(242,230,201,0.42)',
    dust: '242,230,201',
    watermark: 'rgba(242,230,201,0.38)',
    headerInk: '#f2e6c9',
    headerAccent: '#d4553f',
    outroOverlay: 'rgba(10,7,4,0.58)',
  };

  const DIORAMA = {
    bgTop: '#f7edda',
    bgMid: '#eddcc0',
    bgBottom: '#dcc4a0',
    ink: '#241a12',
    inkSoft: 'rgba(36,26,18,0.74)',
    inkFaint: 'rgba(36,26,18,0.46)',
    gold: '#a86a24',
    goldSoft: 'rgba(168,106,36,0.42)',
    line: 'rgba(36,26,18,0.16)',
    stamp: '#c8321e',
    paper: 'rgba(253,249,240,0.96)',
    paperInk: '#241a12',
    paperInkSoft: '#5d4a38',
    subBg: 'rgba(253,249,240,0.96)',
    subBorder: 'rgba(36,26,18,0.14)',
    subInk: '#241a12',
    subActive: '#c8321e',
    subInkFaint: 'rgba(36,26,18,0.38)',
    dust: '120,88,48',
    watermark: 'rgba(60,40,20,0.42)',
    headerInk: '#241a12',
    headerAccent: '#c8321e',
    outroOverlay: 'rgba(247,237,218,0.70)',
  };

  const STYLE_TOKENS = {
    'sejarah/sepia-archive': { display: SERIF, header: false, colors: SEPIA },
    'sejarah/diorama': { display: UI, header: true, colors: DIORAMA },
  };

  let C = SEPIA;

  const FALLBACK_SAFE = { left: 84, right: 996, top: 210, bottom: 1580 };

  const state = {
    width: 1080,
    height: 1920,
    canvasWidth: 1080,
    canvasHeight: 1920,
    scale: 1,
    fps: 30,
    duration: 5,
    watermark: 'LPTech',
    postUrl: null,
    safe: FALLBACK_SAFE,
    punchlinePause: 0.4,
    storyboard: null,
    styleId: 'sejarah/sepia-archive',
    styleHeader: false,
    subs: [],
    subsActive: false,
    boxes: [],
    violations: [],
    bg: null,
  };

  // Petunjuk tata letak per scene, dipakai agar gag tidak menimpa teks.
  const layout = { textBottom: 0 };

  // ---------- utils deterministik ----------
  const clamp01 = (x) => Math.max(0, Math.min(1, x));
  const easeOut = (x) => 1 - Math.pow(1 - clamp01(x), 3);
  const easeInOut = (x) => {
    x = clamp01(x);
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  };
  const span = (t, start, dur) => clamp01((t - start) / Math.max(0.0001, dur));
  const hash = (n) => {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  };
  function mulberry32(a) {
    return function rnd() {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- font & teks ----------
  function setFont(size, weight, family, spacing) {
    ctx.font = `${weight} ${size}px ${family}`;
    if ('letterSpacing' in ctx) ctx.letterSpacing = `${spacing || 0}px`;
  }

  function measure(text, size, weight, family, spacing) {
    setFont(size, weight, family, spacing);
    return ctx.measureText(String(text)).width;
  }

  function wrapText(text, maxWidth, spec) {
    setFont(spec.size, spec.weight, spec.family, spec.spacing);
    const out = [];
    for (const para of String(text).split('\n')) {
      const words = para.trim().split(/\s+/).filter(Boolean);
      if (!words.length) { out.push(''); continue; }
      let line = '';
      for (const w of words) {
        const test = line ? `${line} ${w}` : w;
        if (!line || ctx.measureText(test).width <= maxWidth) line = test;
        else { out.push(line); line = w; }
      }
      if (line) out.push(line);
    }
    return out.length ? out : [''];
  }

  function fitBlock(text, opts) {
    const {
      maxWidth, maxLines, base, min = 24, weight = '700',
      family = DISPLAY, spacing = 0, lineHeight = 1.1,
    } = opts;
    let best = null;
    for (let size = base; size >= min; size -= 2) {
      const spec = { size, weight, family, spacing };
      const lines = wrapText(text, maxWidth, spec);
      let w = 0;
      for (const l of lines) w = Math.max(w, measure(l, size, weight, family, spacing));
      if (lines.length <= maxLines && w <= maxWidth + 0.5) {
        best = { size, lines, lineHeight, width: w, height: lines.length * size * lineHeight };
        break;
      }
    }
    if (best) return best;
    const spec = { size: min, weight, family, spacing };
    const lines = wrapText(text, maxWidth, spec);
    return {
      size: min, lines, lineHeight,
      width: maxWidth,
      height: lines.length * min * lineHeight,
    };
  }

  function recordBox(id, x, y, w, h) {
    const m = ctx.getTransform();
    const pts = [[x, y], [x + w, y], [x, y + h], [x + w, y + h]];
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [px, py] of pts) {
      const X = (m.a * px + m.c * py + m.e) / state.scale;
      const Y = (m.b * px + m.d * py + m.f) / state.scale;
      if (X < x0) x0 = X;
      if (Y < y0) y0 = Y;
      if (X > x1) x1 = X;
      if (Y > y1) y1 = Y;
    }
    state.boxes.push({ id, x0, y0, x1, y1 });
  }

  function drawBlock(id, block, x, y, opts = {}) {
    const {
      align = 'left', baseline = 'top', color = C.ink, alpha = 1,
      audit = true, weight = '700', family = DISPLAY, spacing = 0,
    } = opts;
    if (alpha <= 0.001 || !block || !block.lines.length) return;

    const { size, lines, lineHeight } = block;
    const totalH = lines.length * size * lineHeight;
    let top = y;
    if (baseline === 'middle') top = y - totalH / 2;
    else if (baseline === 'bottom') top = y - totalH;

    ctx.save();
    ctx.globalAlpha *= alpha;
    setFont(size, weight, family, spacing);
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = 'top';
    for (let i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], x, top + i * size * lineHeight);
    }
    if (audit) {
      let w = 0;
      for (const l of lines) w = Math.max(w, ctx.measureText(l).width);
      const left = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
      recordBox(id, left, top, w, totalH * 0.98);
    }
    ctx.restore();
  }

  function drawRule(x, y, width, thickness, color, alpha = 1) {
    if (width <= 0) return;
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    ctx.fillRect(x - width / 2, y, width, thickness);
    ctx.restore();
  }

  function drawKicker(id, text, x, y, opts = {}) {
    if (!text) return;
    const block = {
      size: opts.size || 26,
      lines: [String(text).toUpperCase()],
      lineHeight: 1.2,
    };
    drawBlock(id, block, x, y, {
      align: opts.align || 'center',
      baseline: 'middle',
      color: opts.color || C.gold,
      alpha: opts.alpha ?? 1,
      weight: '600',
      family: UI,
      spacing: opts.spacing ?? 6,
    });
  }

  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.lineTo(x + w - rr, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
    ctx.lineTo(x + w, y + h - rr);
    ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    ctx.lineTo(x + rr, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
    ctx.lineTo(x, y + rr);
    ctx.quadraticCurveTo(x, y, x + rr, y);
    ctx.closePath();
  }

  // ---------- background arsip ----------
  function buildBackground(w, h) {
    if (state.styleId === 'sejarah/diorama') {
      buildBackgroundDiorama(w, h);
      return;
    }
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const g = c.getContext('2d');

    const grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, C.bgTop);
    grad.addColorStop(0.55, C.bgMid);
    grad.addColorStop(1, C.bgBottom);
    g.fillStyle = grad;
    g.fillRect(0, 0, w, h);

    const glow = g.createRadialGradient(w * 0.5, h * 0.36, 30, w * 0.5, h * 0.48, h * 0.78);
    glow.addColorStop(0, 'rgba(255,226,172,0.10)');
    glow.addColorStop(0.52, 'rgba(255,220,160,0.02)');
    glow.addColorStop(1, 'rgba(0,0,0,0.58)');
    g.fillStyle = glow;
    g.fillRect(0, 0, w, h);

    const rnd = mulberry32(0x5e9a2026);
    // bercak kertas tua
    for (let i = 0; i < 90; i++) {
      const x = rnd() * w;
      const y = rnd() * h;
      const r = 40 + rnd() * 230;
      const a = 0.015 + rnd() * 0.035;
      const blob = g.createRadialGradient(x, y, 0, x, y, r);
      blob.addColorStop(0, `rgba(0,0,0,${a})`);
      blob.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = blob;
      g.beginPath();
      g.arc(x, y, r, 0, Math.PI * 2);
      g.fill();
    }
    // serat & debu statis
    for (let i = 0; i < 4600; i++) {
      const x = rnd() * w;
      const y = rnd() * h;
      const a = 0.012 + rnd() * 0.05;
      g.fillStyle = rnd() > 0.45 ? `rgba(244,229,196,${a})` : `rgba(0,0,0,${a})`;
      const s = rnd() > 0.93 ? 2 : 1;
      g.fillRect(x, y, s, s);
    }
    // bingkai arsip
    g.strokeStyle = 'rgba(242,230,201,0.14)';
    g.lineWidth = 2;
    g.strokeRect(40, 40, w - 80, h - 80);
    g.strokeStyle = 'rgba(201,162,39,0.32)';
    g.lineWidth = 1;
    g.strokeRect(52, 52, w - 104, h - 104);

    // sudut arsip
    g.strokeStyle = 'rgba(201,162,39,0.45)';
    g.lineWidth = 3;
    const m = 68, len = 46;
    const corners = [
      [m, m, 1, 1], [w - m, m, -1, 1],
      [m, h - m, 1, -1], [w - m, h - m, -1, -1],
    ];
    for (const [x, y, sx, sy] of corners) {
      g.beginPath();
      g.moveTo(x, y + sy * len);
      g.lineTo(x, y);
      g.lineTo(x + sx * len, y);
      g.stroke();
    }

    state.bg = c;
  }

  // ---------- background diorama ----------
  function buildBackgroundDiorama(w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const g = c.getContext('2d');

    const grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, C.bgTop);
    grad.addColorStop(0.58, C.bgMid);
    grad.addColorStop(1, C.bgBottom);
    g.fillStyle = grad;
    g.fillRect(0, 0, w, h);

    // cahaya hangat dari atas
    const glow = g.createRadialGradient(w * 0.5, h * 0.10, 40, w * 0.5, h * 0.42, h * 0.85);
    glow.addColorStop(0, 'rgba(255,246,224,0.55)');
    glow.addColorStop(0.45, 'rgba(255,240,210,0.18)');
    glow.addColorStop(1, 'rgba(140,100,60,0.10)');
    g.fillStyle = glow;
    g.fillRect(0, 0, w, h);

    // berkas cahaya lembut
    g.save();
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 6; i++) {
      const x = 90 + i * 185;
      const beam = g.createLinearGradient(x, 0, x + 90, h * 0.72);
      beam.addColorStop(0, 'rgba(255,248,230,0.16)');
      beam.addColorStop(1, 'rgba(255,248,230,0)');
      g.fillStyle = beam;
      g.beginPath();
      g.moveTo(x, 0);
      g.lineTo(x + 120, 0);
      g.lineTo(x + 210, h * 0.72);
      g.lineTo(x + 40, h * 0.72);
      g.closePath();
      g.fill();
    }
    g.restore();

    const rnd = mulberry32(0x0d10a3);
    // serat kertas
    for (let i = 0; i < 3400; i++) {
      const x = rnd() * w;
      const y = rnd() * h;
      const a = 0.010 + rnd() * 0.035;
      g.fillStyle = rnd() > 0.45 ? `rgba(255,250,238,${a})` : `rgba(90,60,30,${a * 0.7})`;
      const s = rnd() > 0.94 ? 2 : 1;
      g.fillRect(x, y, s, s);
    }
    // noda kertas halus
    for (let i = 0; i < 40; i++) {
      const x = rnd() * w;
      const y = rnd() * h;
      const r = 60 + rnd() * 260;
      const a = 0.010 + rnd() * 0.018;
      const blob = g.createRadialGradient(x, y, 0, x, y, r);
      blob.addColorStop(0, `rgba(120,80,40,${a})`);
      blob.addColorStop(1, 'rgba(120,80,40,0)');
      g.fillStyle = blob;
      g.beginPath();
      g.arc(x, y, r, 0, Math.PI * 2);
      g.fill();
    }

    // vignette tepi
    const vig = g.createRadialGradient(w * 0.5, h * 0.46, w * 0.35, w * 0.5, h * 0.5, h * 0.78);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(70,42,16,0.22)');
    g.fillStyle = vig;
    g.fillRect(0, 0, w, h);

    state.bg = c;
  }

  function drawDust(t) {
    const w = state.width;
    const h = state.height;
    for (let i = 0; i < 16; i++) {
      const seed = i * 7.13;
      const x = ((hash(seed) * (w + 80) + t * (4 + hash(seed + 2) * 14)) % (w + 80)) - 40;
      const y = (hash(seed + 5) * h + Math.sin(t * 0.4 + seed) * 14 + h) % h;
      const a = 0.025 + hash(seed + 9) * 0.07;
      ctx.fillStyle = `rgba(${C.dust},${a})`;
      ctx.beginPath();
      ctx.arc(x, y, 1 + hash(seed + 1) * 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawWatermark() {
    const w = state.width;
    const h = state.height;
    if (!state.watermark) return;
    ctx.save();
    setFont(26, '400', UI, 2);
    ctx.fillStyle = C.watermark;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(state.watermark, w - 84, h - 270);
    ctx.restore();
  }

  function drawProgress(t) {
    const w = state.width;
    const h = state.height;
    const p = clamp01(t / Math.max(0.001, state.duration));
    ctx.save();
    ctx.fillStyle = 'rgba(201,162,39,0.18)';
    ctx.fillRect(84, h - 122, w - 168, 3);
    ctx.fillStyle = C.gold;
    ctx.fillRect(84, h - 122, (w - 168) * p, 3);
    ctx.restore();
  }

  const SUB_BOTTOM = 1544;
  const SUB_MAX_W = 860;

  /**
   * Subtitle karaoke: kata yang sedang diucapkan disorot.
   * Lewat = subInk, aktif = subActive, belum = subInkFaint.
   * Mengembalikan false bila `wordTimes` tidak ada / jumlahnya tidak cocok.
   */
  function drawKaraoke(sub, block, x, top, t) {
    const wt = sub.wordTimes;
    const parts = block.lines.map((l) => String(l).split(' ').filter(Boolean));
    const flat = parts.flat();
    if (!Array.isArray(wt) || !wt.length || wt.length !== flat.length) return false;

    const active = wt.findIndex((w) => t >= w.start && t < w.end);
    const done = t >= wt[wt.length - 1].end;

    ctx.save();
    setFont(block.size, '600', UI, 0);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    const space = ctx.measureText(' ').width;
    let idx = 0;
    for (let li = 0; li < parts.length; li++) {
      const widths = parts[li].map((p) => ctx.measureText(p).width);
      const lineW = widths.reduce((a, b) => a + b, 0) + space * Math.max(0, widths.length - 1);
      let px = x - lineW / 2;
      const py = top + li * block.size * block.lineHeight;
      for (let k = 0; k < parts[li].length; k++) {
        const i = idx++;
        if (i === active) ctx.fillStyle = C.subActive;
        else if (i < active || done) ctx.fillStyle = C.subInk;
        else ctx.fillStyle = C.subInkFaint;
        ctx.fillText(parts[li][k], px, py);
        px += widths[k] + space;
      }
    }
    ctx.restore();

    recordBox(`${sub.id}`, x - block.width / 2, top, block.width, block.height * 0.98);
    return true;
  }

  function drawSubtitles(t) {
    const list = state.subs || [];
    if (!list.length) return;
    const sub = list.find((s) => t >= s.start && t < s.end);
    if (!sub || !Array.isArray(sub.lines) || !sub.lines.length) return;

    let size = 46;
    const widthAt = (s) => Math.max(...sub.lines.map((l) => measure(l, s, '600', UI, 0)));
    while (size > 34 && widthAt(size) > SUB_MAX_W) size -= 2;

    let block;
    if (widthAt(size) > SUB_MAX_W) {
      block = fitBlock(String(sub.text || sub.lines.join(' ')), {
        maxWidth: SUB_MAX_W, maxLines: 2, base: 46, min: 30, lineHeight: 1.24,
        weight: '600', family: UI,
      });
    } else {
      block = {
        size,
        lines: sub.lines,
        lineHeight: 1.24,
        width: widthAt(size),
        height: sub.lines.length * size * 1.24,
      };
    }

    const w = Math.min(state.safe.right - state.safe.left, block.width + 40);
    const h = block.height + 26;
    const top = SUB_BOTTOM - h;

    ctx.save();
    ctx.fillStyle = C.subBg;
    roundRect(540 - w / 2, top, w, h, 12);
    ctx.fill();
    ctx.strokeStyle = C.subBorder;
    ctx.lineWidth = 1;
    roundRect(540 - w / 2, top, w, h, 12);
    ctx.stroke();
    ctx.restore();

    const drew = drawKaraoke(sub, block, 540, top + 13, t);
    if (!drew) {
      drawBlock(`${sub.id}`, block, 540, top + 13, {
        align: 'center', color: C.subInk, weight: '600', family: UI,
      });
    }
  }

  // ---------- kamera virtual ----------
  function cameraEase(p, ease) {
    if (ease === 'linear') return p;
    if (ease === 'out') return 1 - Math.pow(1 - p, 3);
    return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  }

  function cameraAt(sc, u) {
    const cam = sc && sc.camera;
    if (!cam || !Array.isArray(cam.keys) || !cam.keys.length) return null;
    const p = clamp01(u / Math.max(0.0001, sc.duration));
    const keys = cam.keys;
    let a = keys[0];
    let b = keys[keys.length - 1];
    for (let i = 0; i < keys.length - 1; i++) {
      if (p >= keys[i].at && p <= keys[i + 1].at) {
        a = keys[i];
        b = keys[i + 1];
        break;
      }
    }
    const local = b.at > a.at ? (p - a.at) / (b.at - a.at) : 0;
    const e = cameraEase(clamp01(local), cam.ease);
    return {
      x: a.x + (b.x - a.x) * e,
      y: a.y + (b.y - a.y) * e,
      zoom: a.zoom + (b.zoom - a.zoom) * e,
      rotate: a.rotate + (b.rotate - a.rotate) * e,
      content: Boolean(cam.content),
    };
  }

  function drawBackground(cam) {
    if (!state.bg) {
      ctx.fillStyle = C.bgTop;
      ctx.fillRect(0, 0, state.width, state.height);
      return;
    }
    if (!cam) {
      ctx.drawImage(state.bg, 0, 0);
      return;
    }
    const rot = (cam.rotate * Math.PI) / 180;
    // rotasi butuh sedikit zoom tambahan agar sudut tidak kosong
    const zoom = Math.max(cam.zoom, 1 + Math.abs(rot) * 0.9);
    const maxX = ((zoom - 1) * state.width) / 2;
    const maxY = ((zoom - 1) * state.height) / 2;
    const x = Math.max(-maxX, Math.min(maxX, cam.x));
    const y = Math.max(-maxY, Math.min(maxY, cam.y));
    ctx.save();
    ctx.translate(state.width / 2, state.height / 2);
    ctx.rotate(rot);
    ctx.scale(zoom, zoom);
    ctx.translate(-state.width / 2 + x, -state.height / 2 + y);
    ctx.drawImage(state.bg, 0, 0);
    ctx.restore();
  }

  function applySceneCamera(cam) {
    if (!cam || !cam.content) return;
    ctx.translate(state.width / 2, state.height / 2);
    ctx.rotate((cam.rotate * Math.PI) / 180);
    ctx.scale(cam.zoom, cam.zoom);
    ctx.translate(-state.width / 2 + cam.x, -state.height / 2 + cam.y);
  }

  // ---------- header bab ----------
  function chapterKey(ch) {
    if (!ch) return '';
    if (typeof ch === 'string') return ch;
    return `${ch.text || ''}|${ch.highlight || ''}`;
  }

  function chapterAt(t) {
    const scenes = state.storyboard?.scenes || [];
    let chapter = null;
    let key = '';
    let since = 0;
    for (const s of scenes) {
      if (s.start > t + 0.0001) break;
      if (s.type === 'outro' || s.chapter === false) {
        chapter = null;
        key = '';
        since = s.start;
        continue;
      }
      if (!s.chapter) continue;
      const k = chapterKey(s.chapter);
      if (k !== key) {
        key = k;
        chapter = s.chapter;
        since = s.start;
      }
    }
    return { chapter, since };
  }

  function drawChapter(t, info) {
    if (!state.styleHeader) return;
    const ch = info && info.chapter;
    if (!ch) return;
    const text = typeof ch === 'string' ? ch : String(ch.text || '');
    const highlight = typeof ch === 'string' ? '' : String(ch.highlight || '');
    if (!text) return;

    const p = easeOut(span(t, info.since, 0.55));
    if (p <= 0.001) return;

    const block = fitBlock(text, {
      maxWidth: 912, maxLines: 2, base: 46, min: 30, lineHeight: 1.18,
      weight: '700', family: DISPLAY, spacing: 0,
    });
    const top = 210 + (1 - p) * 12;

    drawBlock('chapter:title', block, 84, top, {
      align: 'left', color: C.headerInk, alpha: p, weight: '700', family: DISPLAY,
    });

    if (!highlight) return;
    ctx.save();
    ctx.globalAlpha *= p;
    setFont(block.size, '700', DISPLAY, 0);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = C.headerAccent;
    for (let i = 0; i < block.lines.length; i++) {
      const line = block.lines[i];
      const idx = line.indexOf(highlight);
      if (idx < 0) continue;
      const dx = idx > 0 ? ctx.measureText(line.slice(0, idx)).width : 0;
      ctx.fillText(highlight, 84 + dx, top + i * block.size * block.lineHeight);
    }
    ctx.restore();
  }

  // ---------- scene diorama ----------
  function mixPt(a, b, k) {
    return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
  }

  function insetQuad(pts, k) {
    const cx = (pts[0][0] + pts[1][0] + pts[2][0] + pts[3][0]) / 4;
    const cy = (pts[0][1] + pts[1][1] + pts[2][1] + pts[3][1]) / 4;
    return pts.map(([x, y]) => [x + (cx - x) * k, y + (cy - y) * k]);
  }

  function quadPath(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }

  // Geometri alas diorama. Prop ditempatkan dengan koordinat layar (x,y) lalu
  // diproyeksikan ke permukaan alas agar tidak pernah melayang.
  const PLATE = { w: 600, d: 400, h: 46 };
  const ISO_COS = Math.cos(Math.PI / 6);

  function plateGeom(cy) {
    const ux = ISO_COS * PLATE.w;
    const uy = 0.5 * PLATE.w;
    const vx = -ISO_COS * PLATE.d;
    const vy = 0.5 * PLATE.d;
    return {
      ...PLATE, ux, uy, vx, vy,
      cx: 540 + (ux + vx) / 2,
      cy,
      cx0: 540,
      cy0: cy - PLATE.h - (uy + vy) / 2,
    };
  }

  function plateProject(g, u, v) {
    return {
      x: g.cx0 + (u * g.ux + v * g.vx) / 2,
      y: g.cy0 + (u * g.uy + v * g.vy) / 2,
    };
  }

  /** Ubah titik layar menjadi koordinat alas (u,v), dijepit di dalam tepi. */
  function plateLocal(g, x, y) {
    const sx = (x - g.cx0) * 2;
    const sy = (y - g.cy0) * 2;
    const det = g.ux * g.vy - g.vx * g.uy;
    const u = (sx * g.vy - sy * g.vx) / det;
    const v = (g.ux * sy - g.uy * sx) / det;
    return {
      u: Math.max(-0.98, Math.min(0.98, u)),
      v: Math.max(-0.98, Math.min(0.98, v)),
    };
  }

  /** Alas dunia: pulau tanah atau meja kayu. */
  function dioramaGround(kind, g) {
    const VP = window.VigenProps;
    if (!VP) return;

    ctx.save();
    ctx.translate(g.cx0, g.cy + 10);
    VP.shadow(ctx, g.w * 0.70, 108, 0.24);
    ctx.restore();

    if (kind === 'table') {
      const f = VP.isoBox(ctx, g.cx, g.cy, g.w, g.d, g.h, {
        top: '#c79a68', left: '#8d6238', right: '#a97b4c', line: 'rgba(74,46,20,0.40)',
      });
      ctx.save();
      ctx.strokeStyle = 'rgba(90,58,28,0.18)';
      ctx.lineWidth = 2;
      for (const k of [0.25, 0.5, 0.75]) {
        const a = mixPt(f.top[0], f.top[1], k);
        const b = mixPt(f.top[3], f.top[2], k);
        ctx.beginPath();
        ctx.moveTo(a[0], a[1]);
        ctx.lineTo(b[0], b[1]);
        ctx.stroke();
      }
      // tepi meja lebih terang
      ctx.strokeStyle = 'rgba(255,232,196,0.45)';
      ctx.lineWidth = 2;
      quadPath(f.top);
      ctx.stroke();
      ctx.restore();
      plateLight(g, f.top);
      return;
    }

    // pulau: tanah berumput dengan sisi gelap
    const f = VP.isoBox(ctx, g.cx, g.cy, g.w, g.d, g.h, {
      top: '#cdb287', left: '#9c8158', right: '#856b46', line: 'rgba(60,42,22,0.40)',
    });
    ctx.save();
    quadPath(insetQuad(f.top, 0.055));
    ctx.fillStyle = 'rgba(226,204,166,0.55)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(96,70,38,0.28)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // lapisan tanah di sisi
    ctx.strokeStyle = 'rgba(52,36,18,0.22)';
    ctx.lineWidth = 2;
    for (const k of [0.45, 0.75]) {
      const a = mixPt(f.left[0], f.left[3], k);
      const b = mixPt(f.left[1], f.left[2], k);
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(b[0], b[1]);
      ctx.stroke();
      const c = mixPt(f.right[0], f.right[3], k);
      const e = mixPt(f.right[1], f.right[2], k);
      ctx.beginPath();
      ctx.moveTo(c[0], c[1]);
      ctx.lineTo(e[0], e[1]);
      ctx.stroke();
    }
    ctx.restore();
    plateLight(g, f.top, true);
  }

  /** Cahaya lembut + butir tanah di permukaan alas (deterministik). */
  function plateLight(g, top, speckles = false) {
    ctx.save();
    quadPath(top);
    ctx.clip();
    const grd = ctx.createRadialGradient(
      g.cx0 - 130, g.cy0 - 90, 40,
      g.cx0, g.cy0, 660,
    );
    grd.addColorStop(0, 'rgba(255,246,224,0.20)');
    grd.addColorStop(1, 'rgba(80,54,26,0.10)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, state.width, state.height);

    if (speckles) {
      const rnd = mulberry32(0x0d10a7);
      for (let i = 0; i < 52; i++) {
        const u = (rnd() * 2 - 1) * 0.94;
        const v = (rnd() * 2 - 1) * Math.max(0, 0.94 - Math.abs(u));
        const p = plateProject(g, u, v);
        const r = 2 + rnd() * 5;
        ctx.fillStyle = i % 3 === 0
          ? 'rgba(120,96,58,0.10)'
          : 'rgba(255,248,228,0.15)';
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, r, r * 0.45, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  /** Animasi masuk objek: pop (default), drop, slide, rise. */
  function entryAt(item, u, fallbackDelay, fallbackAnim) {
    const delay = item.delay ?? fallbackDelay;
    const p = clamp01((u - delay) / 0.5);
    const e = easeOut(p);
    const anim = item.anim || fallbackAnim;
    let dx = 0;
    let dy = 0;
    if (anim === 'drop') dy = -(1 - e) * 150;
    else if (anim === 'slide') dx = (1 - e) * (item.px < 540 ? -200 : 200);
    else if (anim === 'rise') dy = (1 - e) * 70;
    else dy = (1 - e) * 28;
    return { e, dx, dy };
  }

  /** Lapisan dunia: alas + prop + karakter, urut kedalaman. */
  function drawWorldLayer(sc, u, g) {
    const VP = window.VigenProps;
    const VC = window.VigenCast;
    if (!VP) return;
    const ground = sc.ground || 'island';

    if (ground !== 'none') dioramaGround(ground, g);

    const props = (sc.props || []).map((p) => ({ kind: 'prop', ...p }));
    const cast = (sc.cast || []).map((c) => ({ kind: 'cast', ...c }));
    const list = [...props, ...cast];
    if (!list.length) return;

    // Posisi otomatis: prop di baris belakang, karakter di baris depan.
    const autoU = (k, n, spread) => (n > 1 ? -spread + (2 * spread * k) / (n - 1) : 0);
    let pi = 0;
    let ci = 0;
    const placed = list.map((it, i) => {
      let pos;
      if (it.x !== undefined || it.y !== undefined) {
        const loc = plateLocal(g, it.x ?? g.cx0, it.y ?? g.cy0);
        pos = plateProject(g, loc.u, loc.v);
      } else if (it.kind === 'cast') {
        pos = plateProject(g, autoU(ci++, cast.length, 0.45), 0.40);
      } else {
        pos = plateProject(g, autoU(pi++, props.length, 0.40), -0.35);
      }
      return { ...it, px: pos.x, py: pos.y, _i: i };
    }).sort((a, b) => a.py - b.py);

    for (const it of placed) {
      const isCast = it.kind === 'cast';
      const st = entryAt(it, u, (isCast ? 0.26 : 0.18) + it._i * 0.07, isCast ? 'rise' : 'pop');
      if (st.e <= 0.001) continue;

      if (isCast) {
        if (!VC || !VC.has(it.who)) continue;
        VC.draw(ctx, it.who, {
          x: it.px + st.dx,
          y: it.py + st.dy,
          scale: it.scale ?? VC.scaleFor(it.who),
          flip: it.flip,
          rotate: ((it.rotate || 0) * Math.PI) / 180,
          alpha: (it.alpha ?? 1) * st.e,
          t: u,
          pose: it.pose || 'idle',
        });
      } else {
        if (!VP.has(it.name)) continue;
        VP.draw(ctx, it.name, {
          x: it.px + st.dx,
          y: it.py + st.dy,
          scale: it.scale ?? VP.scaleFor(it.name),
          rotate: ((it.rotate || 0) * Math.PI) / 180,
          alpha: (it.alpha ?? 1) * st.e,
          t: u,
        });
      }
    }
  }

  /** Area aman dalam koordinat lokal scene (kebalikan transform kamera). */
  function localSafeRect() {
    const m = ctx.getTransform();
    const s = state.scale || 1;
    const a = m.a / s, b = m.b / s, c = m.c / s, d = m.d / s, e = m.e / s, f = m.f / s;
    const det = a * d - b * c;
    if (Math.abs(det) <= 1e-6) return { ...state.safe };
    const inv = (x, y) => {
      const X = x - e, Y = y - f;
      return [(d * X - c * Y) / det, (a * Y - b * X) / det];
    };
    const pts = [
      inv(state.safe.left, state.safe.top),
      inv(state.safe.right, state.safe.top),
      inv(state.safe.left, state.safe.bottom),
      inv(state.safe.right, state.safe.bottom),
    ];
    let left = Infinity, right = -Infinity, top = Infinity, bottom = -Infinity;
    for (const [x, y] of pts) {
      if (x < left) left = x;
      if (x > right) right = x;
      if (y < top) top = y;
      if (y > bottom) bottom = y;
    }
    return { left, right, top, bottom };
  }

  /** Label penunjuk: titik di objek, garis, lalu chip teks di dekatnya. */
  function drawCallout(c, u, i) {
    const e = easeOut(span(u, 0.9 + i * 0.16, 0.45));
    if (e <= 0.001) return;

    const block = fitBlock(c.text, {
      maxWidth: 268, maxLines: 2, base: 27, min: 19, lineHeight: 1.22,
      weight: '600', family: UI,
    });
    const w = Math.min(300, block.width + 32);
    const h = block.height + 20;
    const safe = localSafeRect();
    const lx = Math.max(safe.left + w / 2 + 8, Math.min(safe.right - w / 2 - 8, c.x + c.dx));
    const ly = Math.max(safe.top + h / 2 + 8, Math.min(safe.bottom - h / 2 - 8, c.y + c.dy));

    ctx.save();
    ctx.globalAlpha *= e;

    const dx = lx - c.x;
    const dy = ly - c.y;
    const len = Math.hypot(dx, dy) || 1;
    const ex = lx - (dx / len) * (w / 2 + 4);
    const ey = ly - (dy / len) * (h / 2 + 4);

    // garis penunjuk
    ctx.strokeStyle = 'rgba(120,84,40,0.55)';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(c.x, c.y);
    ctx.lineTo(ex, ey);
    ctx.stroke();

    // titik jangkar
    ctx.beginPath();
    ctx.arc(c.x, c.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = C.gold;
    ctx.fill();
    ctx.strokeStyle = 'rgba(90,60,20,0.7)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // chip
    roundRect(lx - w / 2, ly - h / 2, w, h, 12);
    ctx.fillStyle = 'rgba(248,239,222,0.94)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,112,58,0.65)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha *= e;
    drawBlock(`${c.id || 'callout'}:${i}`, block, lx, ly, {
      align: 'center', baseline: 'middle', color: C.ink, audit: false,
      weight: '600', family: UI,
    });
    ctx.restore();

    recordBox(`callout:${i}`, lx - w / 2, ly - h / 2, w, h);
  }

  function drawCallouts(sc, u) {
    const list = sc.callouts || [];
    for (let i = 0; i < list.length; i++) drawCallout(list[i], u, i);
  }

  /** Scene dunia isometrik: alas + prop + karakter, kamera hanya pada dunia. */
  function sceneWorld(sc, u, withCallouts) {
    const fade = easeOut(span(u, 0, 0.35));
    const title = sc.title ? fitBlock(sc.title, {
      maxWidth: 912, maxLines: 2, base: 72, min: 40, lineHeight: 1.1,
    }) : null;
    const body = sc.body ? fitBlock(sc.body, {
      maxWidth: 900, maxLines: 3, base: 40, min: 26, lineHeight: 1.4,
      weight: '400', family: UI,
    }) : null;

    const titleY = 352;
    const bodyY = titleY + (title ? title.height + 34 : 0);
    const textEnd = bodyY + (body ? body.height : 0);
    const plateCy = Math.min(1410, Math.max(1310, textEnd + 500));

    // dunia (boleh ikut kamera)
    const cam = cameraAt(sc, u);
    ctx.save();
    if (cam && cam.content) applySceneCamera(cam);
    drawWorldLayer(sc, u, plateGeom(plateCy));
    if (withCallouts) drawCallouts(sc, u);
    ctx.restore();

    // teks selalu di atas dunia dan tidak ikut kamera
    drawKicker(`${sc.id}:kicker`, sc.kicker || (withCallouts ? 'ADEGAN' : 'DIORAMA'), 84, 300, {
      align: 'left', alpha: fade, spacing: 7,
    });
    if (title) {
      drawBlock(`${sc.id}:title`, title, 84, titleY, { color: C.ink, alpha: fade });
    }
    if (body) {
      const p = easeOut(span(u, 0.18, 0.5));
      drawBlock(`${sc.id}:body`, body, 84, bodyY + (1 - p) * 22, {
        color: C.inkSoft, alpha: p, weight: '400', family: UI,
      });
    }
    layout.textBottom = textEnd;

    if (sc.source) {
      const src = fitBlock(sc.source, {
        maxWidth: 820, maxLines: 2, base: 24, min: 20, lineHeight: 1.3,
        weight: '400', family: UI,
      });
      drawBlock(`${sc.id}:source`, src, 84, state.subsActive ? 1328 : 1500, {
        color: C.inkFaint, alpha: fade, weight: '400', family: UI,
      });
    }
  }

  function sceneDiorama(sc, u) {
    sceneWorld(sc, u, false);
  }

  function sceneAdegan(sc, u) {
    sceneWorld(sc, u, true);
  }

  function sceneOutro(sc, u) {
    const fade = easeOut(span(u, 0, 0.45));
    const out = 1 - easeInOut(span(u, sc.duration - 0.4, 0.4));
    const a = Math.min(fade, out);

    ctx.save();
    ctx.globalAlpha *= easeOut(span(u, 0, 0.3));
    ctx.fillStyle = C.outroOverlay;
    ctx.fillRect(0, 0, state.width, state.height);
    ctx.restore();

    const brand = fitBlock(state.watermark || 'LPTech', {
      maxWidth: 760, maxLines: 1, base: 116, min: 60, lineHeight: 1, spacing: 2,
    });
    drawBlock(`${sc.id}:brand`, brand, 540, 790, {
      align: 'center', baseline: 'middle', color: C.ink, alpha: a, spacing: 2,
    });
    drawRule(540, 900, 210 * easeInOut(span(u, 0.25, 0.6)), 3, C.gold, a);

    drawBlock(`${sc.id}:tagline`, {
      size: 34, lines: ['video generator by LPTech'], lineHeight: 1.3,
    }, 540, 980, {
      align: 'center', color: C.inkSoft, alpha: a, weight: '400', family: UI, spacing: 2,
    });

    drawBlock(`${sc.id}:niche`, {
      size: 26, lines: ['sejarah · deadpan-sarkas'], lineHeight: 1.3,
    }, 540, 1060, {
      align: 'center', color: C.gold, alpha: a * 0.9, weight: '400', family: UI, spacing: 4,
    });
  }

  // ---------- gags ----------
  function gagStamp(sc, g, u, p) {
    const pos = g.pos || 'center';
    const x = Number(g.x ?? 540);
    const y = Number(g.y ?? (pos === 'top' ? 560 : pos === 'bottom' ? (state.subsActive ? 1260 : 1360) : 1120));
    const scale = 1.65 - 0.65 * easeOut(p);
    const alpha = easeOut(p);
    const w = 460;
    const h = 176;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(g.rotate !== undefined ? Number(g.rotate) : -0.12);
    ctx.scale(scale, scale);
    ctx.globalAlpha *= alpha;
    ctx.strokeStyle = C.stamp;
    ctx.lineWidth = 6;
    ctx.strokeRect(-w / 2, -h / 2, w, h);
    ctx.lineWidth = 2;
    ctx.strokeRect(-w / 2 + 11, -h / 2 + 11, w - 22, h - 22);
    ctx.restore();

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(g.rotate !== undefined ? Number(g.rotate) : -0.12);
    ctx.scale(scale, scale);
    ctx.globalAlpha *= alpha;
    const main = fitBlock(String(g.text || 'FAKTA'), {
      maxWidth: w - 60, maxLines: 1, base: 64, min: 30, lineHeight: 1, spacing: 2,
    });
    drawBlock(`${sc.id}:stamp-main`, main, 0, -22, {
      align: 'center', baseline: 'middle', color: C.stamp, spacing: 2,
    });
    if (g.sub) {
      drawBlock(`${sc.id}:stamp-sub`, {
        size: 23, lines: [String(g.sub)], lineHeight: 1.1,
      }, 0, 48, {
        align: 'center', baseline: 'middle', color: C.stamp,
        weight: '400', family: UI, spacing: 3,
      });
    }
    ctx.restore();
  }

  function gagRecordScratch(sc, g, u, p) {
    const r = 84;
    const cx = Number(g.x ?? (state.safe.right - r - 12));
    const cy = Number(g.y ?? (state.safe.top + r + 12));
    const a = easeOut(p);
    const wobble = Math.sin(u * 22) * 0.03 * (1 - a);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(0.35 + wobble + easeOut(p) * 0.25);
    ctx.globalAlpha *= a;
    ctx.fillStyle = '#0d0a08';
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    for (let i = 1; i <= 7; i++) {
      ctx.strokeStyle = `rgba(242,230,201,${0.10 + i * 0.012})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, r * (i / 8), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.fillStyle = C.gold;
    ctx.beginPath();
    ctx.arc(0, 0, 34, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0d0a08';
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = C.stamp;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-r * 0.85, -r * 0.3);
    ctx.lineTo(-20, -8);
    ctx.lineTo(26, 16);
    ctx.lineTo(r * 0.9, r * 0.42);
    ctx.stroke();
    ctx.restore();

    drawBlock(`${sc.id}:scratch-label`, {
      size: 20, lines: ['REKAMAN BERHENTI'], lineHeight: 1.2,
    }, state.safe.right - 12, cy + r + 16, {
      align: 'right', color: C.stamp, alpha: a, weight: '700', family: UI, spacing: 2,
    });
  }

  function gagFreezeFrame(sc, g, u, p) {
    const x = 130, y = 420, w = 820, h = 880;
    const a = easeOut(p);
    ctx.save();
    ctx.globalAlpha *= a;
    ctx.strokeStyle = C.gold;
    ctx.lineWidth = 3;
    const len = 64;
    const pts = [
      [x, y, 1, 1], [x + w, y, -1, 1],
      [x, y + h, 1, -1], [x + w, y + h, -1, -1],
    ];
    for (const [px, py, sx, sy] of pts) {
      ctx.beginPath();
      ctx.moveTo(px, py + sy * len);
      ctx.lineTo(px, py);
      ctx.lineTo(px + sx * len, py);
      ctx.stroke();
    }
    ctx.restore();
    drawBlock(`${sc.id}:freeze-tag`, {
      size: 24, lines: ['FREEZE'], lineHeight: 1.2,
    }, x, y - 34, {
      align: 'left', color: C.gold, alpha: a, weight: '600', family: UI, spacing: 6,
    });
  }

  function gagCorrectionTag(sc, g, u, p) {
    gagStamp(sc, { ...g, text: g.text || 'KOREKSI', sub: g.sub || 'data diperbarui', y: g.y ?? (state.subsActive ? 1268 : 1372) }, u, p);
  }

  function gagReceipt(sc, g, u, p) {
    const rows = Array.isArray(g.rows) ? g.rows : [];
    const hasTotal = g.total !== undefined && g.total !== null;
    const rowH = 54;
    const headerH = 92;
    const totalH = hasTotal ? 84 : 0;
    const w = 720;
    const h = headerH + rows.length * rowH + totalH + 46;
    const bottom = state.subsActive ? 1380 : state.safe.bottom - 40;
    const limit = state.subsActive ? bottom - h : state.safe.bottom - h - 20;
    const floor = layout.textBottom ? layout.textBottom + 24 : 340;
    let top = bottom - h;
    if (top < floor) top = Math.min(floor, limit);
    if (top < state.safe.top) top = state.safe.top + 10;
    const a = easeOut(p);
    const rise = (1 - a) * 34;

    ctx.save();
    ctx.translate(540, top + rise);
    ctx.rotate(-0.022);
    ctx.globalAlpha *= a;
    ctx.fillStyle = 'rgba(0,0,0,0.38)';
    roundRect(-w / 2 + 10, 10, w, h, 8);
    ctx.fill();
    ctx.fillStyle = C.paper;
    roundRect(-w / 2, 0, w, h, 8);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(540, top + rise);
    ctx.rotate(-0.022);
    ctx.globalAlpha *= a;

    drawBlock(`${sc.id}:receipt-title`, {
      size: 30, lines: [String(g.title || 'CATATAN').toUpperCase()], lineHeight: 1.2,
    }, 0, 34, {
      align: 'center', color: C.paperInk, weight: '700', family: UI, spacing: 5,
    });

    ctx.save();
    ctx.strokeStyle = 'rgba(51,36,20,0.35)';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(-w / 2 + 42, headerH - 18);
    ctx.lineTo(w / 2 - 42, headerH - 18);
    ctx.stroke();
    ctx.restore();

    rows.forEach((row, i) => {
      const label = Array.isArray(row) ? row[0] : row.label;
      const value = Array.isArray(row) ? row[1] : row.value;
      const y = headerH + i * rowH;
      drawBlock(`${sc.id}:receipt-l${i}`, {
        size: 26, lines: [String(label ?? '')], lineHeight: 1.2,
      }, -w / 2 + 48, y, {
        align: 'left', color: C.paperInk, weight: '400', family: UI,
      });
      drawBlock(`${sc.id}:receipt-v${i}`, {
        size: 26, lines: [String(value ?? '')], lineHeight: 1.2,
      }, w / 2 - 48, y, {
        align: 'right', color: C.paperInk, weight: '700', family: UI,
      });
    });

    if (hasTotal) {
      const y = headerH + rows.length * rowH + 24;
      ctx.save();
      ctx.strokeStyle = 'rgba(51,36,20,0.55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-w / 2 + 42, y - 18);
      ctx.lineTo(w / 2 - 42, y - 18);
      ctx.stroke();
      ctx.restore();
      drawBlock(`${sc.id}:receipt-total-l`, {
        size: 28, lines: ['TOTAL'], lineHeight: 1.2,
      }, -w / 2 + 48, y, {
        align: 'left', color: C.paperInk, weight: '700', family: UI, spacing: 3,
      });
      drawBlock(`${sc.id}:receipt-total-v`, {
        size: 30, lines: [String(g.total)], lineHeight: 1.2,
      }, w / 2 - 48, y, {
        align: 'right', color: C.paperInk, weight: '700', family: UI,
      });
    }
    ctx.restore();
  }

  function gagChatBubble(sc, g, u, p) {
    const text = String(g.text || '');
    const name = g.name ? String(g.name) : '';
    const side = g.side === 'right';
    const maxW = 720;
    const block = fitBlock(text, {
      maxWidth: maxW - 64, maxLines: 5, base: 36, min: 24, lineHeight: 1.34,
      weight: '400', family: UI,
    });
    const w = Math.min(maxW, block.width + 64);
    const h = block.height + 56;
    const x = side ? state.safe.right - w : state.safe.left;
    const maxY = (layout.asideTop || state.safe.bottom) - h - 34;
    const y = Number(g.y ?? Math.max(900, Math.min(1110, maxY)));
    const a = easeOut(p);
    const scale = 0.94 + 0.06 * a;

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.globalAlpha *= a;
    if (name) {
      ctx.save();
      setFont(24, '600', UI, 2);
      ctx.fillStyle = C.gold;
      ctx.textAlign = side ? 'right' : 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(name, side ? w : 0, -18);
      ctx.restore();
    }
    ctx.fillStyle = C.paper;
    roundRect(0, 0, w, h, 26);
    ctx.fill();
    ctx.beginPath();
    if (side) {
      ctx.moveTo(w - 52, h - 2);
      ctx.lineTo(w - 30, h + 22);
      ctx.lineTo(w - 84, h - 2);
    } else {
      ctx.moveTo(52, h - 2);
      ctx.lineTo(30, h + 22);
      ctx.lineTo(84, h - 2);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.globalAlpha *= a;
    drawBlock(`${sc.id}:bubble-text`, block, 32, 28, {
      color: C.paperInk, weight: '400', family: UI,
    });
    ctx.restore();
  }

  function drawGags(sc, u) {
    for (const g of sc.gags || []) {
      let at = g.at !== undefined ? Number(g.at) : 0;
      if (!Number.isFinite(at)) at = 0;
      if (sc.type === 'punchline') at += Number(sc.pause ?? state.punchlinePause);
      if (u < at) continue;
      const p = span(u, at, 0.34);
      if (g.type === 'stamp') gagStamp(sc, g, u, p);
      else if (g.type === 'record-scratch') gagRecordScratch(sc, g, u, p);
      else if (g.type === 'freeze-zoom') gagFreezeFrame(sc, g, u, p);
      else if (g.type === 'timeline-corrected') gagCorrectionTag(sc, g, u, p);
      else if (g.type === 'receipt') gagReceipt(sc, g, u, p);
      else if (g.type === 'chat-bubble') gagChatBubble(sc, g, u, p);
    }
  }

  function sceneZoom(sc, u) {
    const fz = (sc.gags || []).find((g) => g.type === 'freeze-zoom');
    if (!fz) return 1;
    const at = Number(fz.at ?? 0);
    const to = Number(fz.to ?? 1.08);
    const p = easeInOut(span(u, at, Math.max(0.3, sc.duration - at)));
    return 1 + (to - 1) * p;
  }

  function drawScene(sc, u) {
    const zoom = sceneZoom(sc, u);
    layout.textBottom = 0;
    layout.asideTop = 0;
    ctx.save();
    if (zoom !== 1) {
      ctx.translate(540, 880);
      ctx.scale(zoom, zoom);
      ctx.translate(-540, -880);
    }
    if (sc.type === 'hook') sceneHook(sc, u);
    else if (sc.type === 'fact') sceneFact(sc, u);
    else if (sc.type === 'timeline') sceneTimeline(sc, u);
    else if (sc.type === 'quote') sceneQuote(sc, u);
    else if (sc.type === 'stat') sceneStat(sc, u);
    else if (sc.type === 'deadpan') sceneDeadpan(sc, u);
    else if (sc.type === 'punchline') scenePunchline(sc, u);
    else if (sc.type === 'outro') sceneOutro(sc, u);
    else if (sc.type === 'diorama') sceneDiorama(sc, u);
    else if (sc.type === 'adegan') sceneAdegan(sc, u);
    ctx.restore();
    if (zoom !== 1) {
      if (layout.textBottom) layout.textBottom = 880 + (layout.textBottom - 880) * zoom;
      if (layout.asideTop) layout.asideTop = 880 + (layout.asideTop - 880) * zoom;
    }
    drawGags(sc, u);
  }

  // ---------- frame ----------
  function audit() {
    const s = state.safe;
    const out = [];
    for (const b of state.boxes) {
      const over = [];
      if (b.x0 < s.left) over.push(`kiri ${Math.round(s.left - b.x0)}px`);
      if (b.x1 > s.right) over.push(`kanan ${Math.round(b.x1 - s.right)}px`);
      if (b.y0 < s.top) over.push(`atas ${Math.round(s.top - b.y0)}px`);
      if (b.y1 > s.bottom) over.push(`bawah ${Math.round(b.y1 - s.bottom)}px`);
      if (over.length) out.push({ ...b, over });
    }
    state.violations = out;
  }

  function draw(t) {
    const w = state.width;
    const h = state.height;
    state.boxes = [];
    ctx.setTransform(state.scale, 0, 0, state.scale, 0, 0);

    const scenes = state.storyboard?.scenes || [];
    const active = scenes.filter((s) => t >= s.start && t < s.end);
    if (!active.length && scenes.length) {
      const last = scenes[scenes.length - 1];
      if (t >= last.end) active.push(last);
    }

    const lead = active[0] || null;
    const leadCam = lead ? cameraAt(lead, t - lead.start) : null;
    const worldScene = Boolean(lead) && (lead.type === 'diorama' || lead.type === 'adegan');
    // Scene dunia menggerakkan dunianya sendiri; latar ikut bila content true.
    const bgCam = leadCam && (!worldScene || leadCam.content) ? leadCam : null;
    drawBackground(bgCam);
    drawDust(t);

    const chapterInfo = state.styleHeader ? chapterAt(t) : { chapter: null };
    const headerShift = chapterInfo.chapter ? 48 : 0;
    for (const sc of active) {
      const u = t - sc.start;
      const cam = cameraAt(sc, u);
      const isWorld = sc.type === 'diorama' || sc.type === 'adegan';
      ctx.save();
      // Scene dunia menerapkan kamera hanya ke lapisan dunia (teks tetap diam).
      if (!isWorld) applySceneCamera(cam);
      ctx.translate(0, headerShift);
      ctx.globalAlpha *= sceneFade(sc, u);
      drawScene(sc, u);
      ctx.restore();
    }

    drawChapter(t, chapterInfo);
    drawSubtitles(t);
    drawProgress(t);
    drawWatermark();
    audit();
  }

  // ---------- api ----------
  window.boot = async function boot(cfg) {
    const logicalW = Number(cfg.logicalWidth || cfg.width || 1080);
    const logicalH = Number(cfg.logicalHeight || cfg.height || 1920);
    const canvasW = Number(cfg.width || logicalW);
    const canvasH = Number(cfg.height || logicalH);

    state.width = logicalW;
    state.height = logicalH;
    state.canvasWidth = canvasW;
    state.canvasHeight = canvasH;
    state.scale = canvasW / logicalW;
    state.fps = cfg.fps || 30;
    state.watermark = cfg.watermark || 'LPTech';
    state.postUrl = cfg.postUrl || null;

    const sb = cfg.storyboard || null;
    state.storyboard = sb;

    state.styleId = sb?.style || 'sejarah/sepia-archive';
    const tokens = STYLE_TOKENS[state.styleId] || STYLE_TOKENS['sejarah/sepia-archive'];
    C = tokens.colors;
    DISPLAY = tokens.display;
    state.styleHeader = Boolean(tokens.header);

    state.subs = Array.isArray(sb?.subs) ? sb.subs : [];
    state.subsActive = state.subs.length > 0;
    state.duration = sb?.duration ?? cfg.duration ?? 5;
    state.safe = sb?.safe || FALLBACK_SAFE;
    state.punchlinePause = sb?.punchlinePause ?? 0.4;

    // Validasi nama prop/karakter scene dunia sedini mungkin (gagal jelas).
    if (sb && Array.isArray(sb.scenes) && window.VigenProps) {
      const badProps = [];
      const badCast = [];
      for (const sc of sb.scenes) {
        if (sc.type !== 'diorama' && sc.type !== 'adegan') continue;
        for (const p of sc.props || []) {
          if (!window.VigenProps.has(p.name)) badProps.push(`${sc.id}:${p.name}`);
        }
        for (const c of sc.cast || []) {
          if (!window.VigenCast || !window.VigenCast.has(c.who)) badCast.push(`${sc.id}:${c.who}`);
        }
      }
      if (badProps.length) {
        throw new Error(`prop tidak dikenal (${badProps.join(', ')}). Pilihan: ${window.VigenProps.names.join(', ')}`);
      }
      if (badCast.length) {
        const names = window.VigenCast ? window.VigenCast.names.join(', ') : '-';
        throw new Error(`karakter tidak dikenal (${badCast.join(', ')}). Pilihan: ${names}`);
      }
    }

    canvas.width = canvasW;
    canvas.height = canvasH;
    canvas.style.width = canvasW + 'px';
    canvas.style.height = canvasH + 'px';

    const fonts = cfg.fonts || {};
    for (const [family, dataUrl] of Object.entries(fonts)) {
      const face = new FontFace(family, `url(${dataUrl})`);
      await face.load();
      document.fonts.add(face);
    }
    await document.fonts.ready;

    buildBackground(state.width, state.height);
    draw(0);
    return true;
  };

  window.seek = function seek(t) {
    draw(t);
    return true;
  };

  window.__frame = function frame(t) {
    draw(t);
    return canvas.toDataURL('image/png');
  };

  window.__frameEnc = function frameEnc(t, type, quality) {
    draw(t);
    return canvas.toDataURL(type, quality);
  };

  window.__sendFrame = async function sendFrame(t, fmt) {
    draw(t);
    if (!state.postUrl) throw new Error('postUrl belum diatur');
    let body;
    const [kind, q] = String(fmt || 'raw').split(':');
    if (kind === 'png' || kind === 'jpeg' || kind === 'webp') {
      const type = `image/${kind}`;
      const quality = q === undefined ? 0.95 : Number(q);
      body = await new Promise((resolve, reject) => {
        canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('toBlob gagal'))), type, quality);
      });
    } else {
      body = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    }
    const res = await fetch(state.postUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream', 'X-Vigen-Format': kind || 'raw' },
      body,
    });
    if (!res.ok) throw new Error('POST frame gagal: ' + res.status);
    return {
      bytes: body.length || body.byteLength || 0,
      violations: state.violations,
    };
  };

  window.__auditFrame = function auditFrame(t) {
    draw(t);
    return {
      violations: state.violations,
      boxes: state.boxes,
      duration: state.duration,
      safe: state.safe,
    };
  };

  window.__violations = function violations() {
    return state.violations;
  };

  window.__bench = function bench(t) {
    draw(t);
    const a = performance.now();
    const d = canvas.toDataURL('image/png');
    const b = performance.now();
    return { encodeMs: Math.round((b - a) * 10) / 10, bytes: d.length };
  };

  window.__info = function info() {
    return {
      width: state.width,
      height: state.height,
      fps: state.fps,
      duration: state.duration,
      scenes: state.storyboard?.scenes?.length || 0,
    };
  };
})();
</script>
</body>
</html>
