<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Vigen cast sheet</title>
<style>
  html, body { margin: 0; padding: 0; background: #dcc4a0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script src="../src/runtime/cast.js"></script>
<script>
(() => {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d', { alpha: false });
  const W = 1080;
  const H = 1920;
  const UI = '"DejaVu Sans", sans-serif';

  function background() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#f7edda');
    g.addColorStop(0.6, '#eddcc0');
    g.addColorStop(1, '#dcc4a0');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const glow = ctx.createRadialGradient(W * 0.5, 120, 40, W * 0.5, 560, 1100);
    glow.addColorStop(0, 'rgba(255,246,224,0.55)');
    glow.addColorStop(1, 'rgba(140,100,60,0.08)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
  }

  function header() {
    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#241a12';
    ctx.font = `700 54px ${UI}`;
    ctx.fillText('Karakter', 84, 90);
    ctx.fillStyle = '#c8321e';
    ctx.fillText('stylized', 84 + ctx.measureText('Karakter ').width, 90);
    ctx.font = `400 26px ${UI}`;
    ctx.fillStyle = 'rgba(36,26,18,0.62)';
    ctx.fillText('sejarah/diorama · 5 peran · deterministik', 84, 158);
    ctx.restore();
  }

  function cell(x, y, name, pose) {
    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.strokeStyle = '#5a3a1c';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - 170, y - 330, 340, 420);
    ctx.restore();

    const drawn = window.VigenCast.draw(ctx, name, {
      x, y, scale: 1, t: 1.4, pose,
    });
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = `600 24px ${UI}`;
    ctx.fillStyle = drawn ? '#241a12' : '#c8321e';
    ctx.fillText(`${name} · ${pose}`, x, y + 40);
    ctx.restore();
    return drawn;
  }

  function draw() {
    background();
    header();
    const names = window.VigenCast.names;
    const poses = ['idle', 'point', 'hold', 'idle', 'point'];
    const cols = 3;
    let missing = 0;
    names.forEach((name, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const x = 190 + col * 350;
      const y = 560 + row * 480;
      if (!cell(x, y, name, poses[i] || 'idle')) missing++;
    });
    return { names, missing };
  }

  window.boot = async function boot(cfg) {
    const cw = Number(cfg.width || W);
    const ch = Number(cfg.height || H);
    canvas.width = cw;
    canvas.height = ch;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    draw();
    return true;
  };

  window.__snapshot = function snapshot() {
    const info = draw();
    return {
      data: canvas.toDataURL('image/png'),
      names: info.names,
      missing: info.missing,
    };
  };
})();
</script>
</body>
</html>
